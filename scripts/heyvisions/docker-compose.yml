# HeyVisions fork — 本地开发用的数据服务。
#
# 上游官方推荐 `npx learnhouse dev`；这份 compose 是给本地跑 API + Web 时用的，
# 端口避开本机已占用的 5432/6379，Postgres 用 pgvector 镜像（课程 embedding 需要）。
#
#   docker compose -f scripts/heyvisions/docker-compose.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hv-lms-postgres
    environment:
      POSTGRES_USER: learnhouse
      POSTGRES_PASSWORD: learnhouse
      POSTGRES_DB: learnhouse
    ports:
      - "15432:5432"
    volumes:
      - hv-lms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hv-lms-redis
    ports:
      - "16379:6379"

volumes:
  hv-lms-pgdata:
